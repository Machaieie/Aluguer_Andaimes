name: Testar e publicar

# Corre os testes em cada push e pull request.
# Em cada push para o ramo main, publica o protótipo no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe do JavaScript
        run: node --check app.js

      - name: Testar as regras de negócio
        run: npm test

      - name: Preparar os ficheiros do site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/

      - name: Enviar o site para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
